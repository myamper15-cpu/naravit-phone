
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>My iPhone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171717;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.phone {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  background-color: #b5aa82;
  background-image:
    linear-gradient(180deg, #0002, #0003),
    radial-gradient(ellipse at 50% 70%, #8e866d, #c6b98c 55%, #776e5b);
  background-size: cover;
  background-position: center;
}

/* WALLPAPER PICKER */
.wallpaper-picker {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.change-wallpaper {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 20;
  padding: 7px 10px;
  border-radius: 20px;
  background: #0007;
  border: 1px solid #ffffff55;
  color: white;
  font-size: 11px;
}

/* STATUS BAR */
.topbar {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 28px);
  left: 10%;
  right: 8%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 22px;
  font-weight: 750;
  z-index: 2;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 17px;
}

.signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.signal i:nth-child(1) { height: 6px; }
.signal i:nth-child(2) { height: 9px; }
.signal i:nth-child(3) { height: 13px; }
.signal i:nth-child(4) { height: 17px; }

.battery {
  min-width: 34px;
  padding: 1px 4px;
  border-radius: 5px;
  background: #ffffffeb;
  color: #333;
  font-size: 13px;
  text-align: center;
  font-weight: 800;
}

/* LOCK SCREEN */
.lock-glyph {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 92px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 25px;
}

.date {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 169px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 25px;
  font-weight: 700;
  text-shadow: 0 1px 5px #0003;
}

.clock {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 205px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(110px, 29vw, 150px);
  font-weight: 300;
  letter-spacing: -6px;
  line-height: 1;
  color: #ffffff61;
  -webkit-text-stroke: 1px #ffffff5c;
  text-shadow: 0 2px 2px #0002;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* FLASHLIGHT AND CAMERA */
.bottom-controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 47px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 11%;
  gap: 8px;
}

.round {
  width: 70px;
  height: 70px;
  flex: 0 0 70px;
  border: 1px solid #ffffff6b;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff33;
  color: white;
  font-size: 29px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.focus {
  font-size: clamp(12px, 3.6vw, 19px);
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 1px 4px #0005;
}

/* HOME INDICATOR */
.home-indicator {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  width: 135px;
  height: 5px;
  border-radius: 100px;
  background: white;
  z-index: 12;
}

/* PASSCODE */
.passcode {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 15;
  background: #17171dcc;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 85px) 20px 50px;
}

.passcode.show {
  display: block;
}

.passcode h2 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 25px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin: 25px 0;
}

.dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.dot.filled {
  background: white;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 68px);
  gap: 12px;
  justify-content: center;
  margin: 22px auto;
}

.key {
  width: 68px;
  height: 68px;
  border: 1px solid #ffffff35;
  border-radius: 50%;
  background: #ffffff27;
  color: white;
  font-size: 28px;
}

.pass-message {
  height: 22px;
  font-size: 14px;
}

.cancel {
  background: transparent;
  color: white;
  border: 0;
  font-size: 16px;
  padding: 12px;
}

/* HOME SCREEN */
.home-screen {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  color: white;
  background:
    linear-gradient(180deg, #0002, #0003),
    linear-gradient(115deg, #b9ad8b, #777365 48%, #b6ad98 75%, #6b6659);
}

.home-screen.show {
  display: block;
}

.widgets {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 92px);
  left: 6%;
  right: 6%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5%;
}

.calendar-widget,
.spotify-widget {
  aspect-ratio: 1 / 1;
  border-radius: 28px;
  overflow: hidden;
}

.calendar-widget {
  padding: 23px 16px;
  background: white;
  color: #111;
}

.calendar-day {
  color: #f04452;
  font-size: clamp(13px, 3.5vw, 23px);
  font-weight: 800;
}

.calendar-number {
  margin-top: 2px;
  font-size: clamp(43px, 9vw, 61px);
  line-height: 1.1;
  font-weight: 500;
}

.calendar-events {
  margin-top: 24px;
  color: #85858a;
  font-size: clamp(14px, 3.8vw, 23px);
  line-height: 1.25;
  font-weight: 600;
}

.spotify-widget {
  padding: 18px 12px 14px;
  background: rgba(92, 108, 128, .86);
  border: 1px solid #ffffff35;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.spotify-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 7px;
}

.album-art {
  width: 68%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #263b50, #9eabb5);
  color: white;
  font-family: Georgia, serif;
  font-size: 45px;
}

.spotify-logo {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: white;
  color: #5c6878;
  border-radius: 50%;
  font-size: 25px;
  font-weight: 900;
}

.spotify-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}

.song-title {
  font-size: clamp(13px, 3.5vw, 21px);
  font-weight: 750;
}

.song-artist {
  margin-top: 5px;
  font-size: clamp(12px, 3.2vw, 19px);
  color: #d6d9df;
  font-weight: 600;
}

.play-button {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: white;
  color: #596575;
  font-size: 21px;
}

.widget-labels {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 92px + 41vw + 12px);
  left: 6%;
  right: 6%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5%;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
}

/* APPS */
.app-grid {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 92px + 41vw + 60px);
  left: 6%;
  right: 6%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 12px;
  row-gap: 20px;
}

.home-app {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  font-size: clamp(10px, 3.4vw, 17px);
  font-weight: 600;
  white-space: nowrap;
}

.app-icon {
  width: min(100%, 82px);
  aspect-ratio: 1;
  border: 0;
  border-radius: 23%;
  display: grid;
  place-items: center;
  font-size: 40px;
  color: white;
  box-shadow: 0 2px 5px #0002;
}

.settings-app {
  background: linear-gradient(#d8d8df, #777987);
}

.instagram-app {
  background: linear-gradient(35deg, #ffd35e, #ff1768, #8529db);
  font-size: 60px;
  font-weight: 300;
}

.photos-app {
  background: white;
  font-size: 40px;
}

.facebook-app {
  background: #0866ff;
  font-size: 70px;
  font-weight: 800;
}

.music-app {
  background: linear-gradient(#ff4383, #ed174e);
  font-size: 50px;
}

.weather-app {
  background: linear-gradient(#43b9ff, #0876d8);
  font-size: 38px;
}

.clock-app {
  background: white;
  color: #333;
  font-size: 40px;
}

.youtube-app {
  background: white;
  color: #ff0033;
  font-size: 38px;
}

/* SEARCH */
.search-button {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 122px);
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 18px;
  border: 1px solid #ffffff70;
  border-radius: 24px;
  background: #ffffff26;
  color: white;
  font-size: 14px;
  font-weight: 600;
}

/* DOCK */
.home-dock {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  left: 4%;
  right: 4%;
  height: 90px;
  padding: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 1px solid #ffffff70;
  border-radius: 35px;
  background: rgba(220, 215, 198, .30);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.dock-app {
  width: 25%;
  max-width: 82px;
  aspect-ratio: 1;
  border: 0;
  border-radius: 23%;
  display: grid;
  place-items: center;
  font-size: 42px;
  color: white;
}

.phone-app,
.messages-app,
.facetime-app {
  background: linear-gradient(#55ed72, #12bd49);
}

.contacts-app {
  background: linear-gradient(#eeeee5, #bcbcb1);
  color: white;
}

/* SHORT SCREENS */
@media (max-height: 750px) {
  .widgets {
    top: calc(env(safe-area-inset-top, 0px) + 65px);
  }

  .calendar-widget {
    padding: 16px 12px;
  }

  .spotify-widget {
    padding: 13px 10px;
  }

  .calendar-events {
    margin-top: 15px;
  }

  .widget-labels {
    display: none;
  }

  .app-grid {
    top: calc(env(safe-area-inset-top, 0px) + 65px + 41vw + 18px);
    row-gap: 12px;
  }

  .search-button {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
  }

  .home-dock {
    height: 78px;
  }

  .app-icon {
    font-size: 34px;
  }

  .instagram-app {
    font-size: 50px;
  }

  .facebook-app {
    font-size: 58px;
  }
}
</style>
</head>

<body>
<main class="phone" id="phone">

  <label class="change-wallpaper" for="wallpaperFile">
    Change wallpaper
  </label>

  <input
    class="wallpaper-picker"
    id="wallpaperFile"
    type="file"
    accept="image/*"
  >

  <!-- LOCK SCREEN -->
  <div class="topbar">
    <span class="tm">TM</span>
    <span class="status-icons">
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>
      <span class="wifi">◔</span>
      <span class="battery">33</span>
    </span>
  </div>

  <div class="lock-glyph">🔒</div>
  <div class="date" id="date">Mon Oct 26</div>
  <div class="clock" id="clock">4:41</div>

  <div class="bottom-controls">
    <button class="round" id="flashlight" aria-label="Flashlight">🔦</button>
    <div class="focus">☾ Do Not Disturb</div>
    <button class="round" id="camera" aria-label="Camera">📷</button>
  </div>

  <!-- HOME SCREEN -->
  <section class="home-screen" id="homeScreen">

    <div class="widgets">
      <div class="calendar-widget">
        <div class="calendar-day" id="calendarDay">MONDAY</div>
        <div class="calendar-number" id="calendarNumber">26</div>
        <div class="calendar-events">No Events<br>Today</div>
      </div>

      <div class="spotify-widget">
        <div class="spotify-top">
          <div class="album-art">♪</div>
          <div class="spotify-logo">≋</div>
        </div>

        <div class="spotify-bottom">
          <div>
            <div class="song-title">Black Card</div>
            <div class="song-artist">Phuwin</div>
          </div>
          <button class="play-button" id="playButton">▶</button>
        </div>
      </div>
    </div>

    <div class="widget-labels">
      <span>Calendar</span>
      <span>Spotify</span>
    </div>

    <div class="app-grid">
      <div class="home-app">
        <button class="app-icon settings-app">⚙️</button>
        <span>Settings</span>
      </div>

      <div class="home-app">
        <button class="app-icon instagram-app">◎</button>
        <span>Instagram</span>
      </div>

      <div class="home-app">
        <button class="app-icon photos-app">🌈</button>
        <span>Photos</span>
      </div>

      <div class="home-app">
        <button class="app-icon facebook-app">f</button>
        <span>Facebook</span>
      </div>

      <div class="home-app">
        <button class="app-icon music-app">♫</button>
        <span>Music</span>
      </div>

      <div class="home-app">
        <button class="app-icon weather-app">🌤️</button>
        <span>Weather</span>
      </div>

      <div class="home-app">
        <button class="app-icon clock-app">🕒</button>
        <span>Clock</span>
      </div>

      <div class="home-app">
        <button class="app-icon youtube-app">▶</button>
        <span>YouTube</span>
      </div>
    </div>

    <button class="search-button" id="searchButton">⌕ Search</button>

    <div class="home-dock">
      <button class="dock-app phone-app">☎</button>
      <button class="dock-app messages-app">●</button>
      <button class="dock-app facetime-app">▣</button>
      <button class="dock-app contacts-app">👤</button>
    </div>

    <div class="home-indicator"></div>
  </section>

  <!-- PASSCODE SCREEN -->
  <section class="passcode" id="passcode">
    <h2>Enter Passcode</h2>
    <div class="dots" id="dots"></div>
    <div class="pass-message" id="message"></div>
    <div class="keypad" id="keypad"></div>
    <button class="cancel" id="cancel">Cancel</button>
  </section>

  <div class="home-indicator" id="lockIndicator"></div>
</main>

<script>
const PASSCODE = "0705";
let entered = "";
let touchStartY = null;

const phone = document.getElementById("phone");
const passcode = document.getElementById("passcode");
const homeScreen = document.getElementById("homeScreen");
const dots = document.getElementById("dots");
const message = document.getElementById("message");
const lockIndicator = document.getElementById("lockIndicator");

/* LIVE CLOCK AND DATE */
function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit",
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "short",
      month: "short",
      day: "numeric"
    });

  document.getElementById("calendarDay").textContent =
    now.toLocaleDateString([], {
      weekday: "long"
    }).toUpperCase();

  document.getElementById("calendarNumber").textContent =
    now.getDate();
}

updateClock();
setInterval(updateClock, 1000);

/* PASSCODE DOTS */
function updateDots() {
  dots.innerHTML = "";

  for (let i = 0; i < 4; i++) {
    const dot = document.createElement("span");
    dot.className = "dot" + (i < entered.length ? " filled" : "");
    dots.appendChild(dot);
  }
}

/* OPEN AND CLOSE PASSCODE */
function openPasscode() {
  if (homeScreen.classList.contains("show")) return;

  entered = "";
  message.textContent = "";
  updateDots();
  passcode.classList.add("show");
}

function closePasscode() {
  passcode.classList.remove("show");
  entered = "";
  message.textContent = "";
  updateDots();
}

/* UNLOCK TO HOME SCREEN */
function unlockPhone() {
  closePasscode();
  homeScreen.classList.add("show");
  lockIndicator.style.display = "none";
}

/* CHECK PASSCODE */
function pressDigit(number) {
  if (entered.length >= 4) return;

  entered += number;
  updateDots();

  if (entered.length === 4) {
    if (entered === PASSCODE) {
      message.textContent = "Unlocked!";
      setTimeout(unlockPhone, 350);
    } else {
      message.textContent = "Incorrect passcode";

      setTimeout(() => {
        entered = "";
        message.textContent = "";
        updateDots();
      }, 700);
    }
  }
}

/* CREATE NUMBER KEYPAD */
const keypad = document.getElementById("keypad");

["1","2","3","4","5","6","7","8","9","","0","⌫"]
.forEach(number => {
  const button = document.createElement("button");
  button.className = "key";
  button.type = "button";
  button.textContent = number;

  if (number === "") {
    button.style.visibility = "hidden";
    button.disabled = true;
  } else if (number === "⌫") {
    button.style.fontSize = "24px";

    button.onclick = () => {
      entered = entered.slice(0, -1);
      message.textContent = "";
      updateDots();
    };
  } else {
    button.onclick = () => pressDigit(number);
  }

  keypad.appendChild(button);
});

document.getElementById("cancel").onclick = closePasscode;
document.getElementById("camera").onclick = openPasscode;

/* FLASHLIGHT IS A VISUAL DEMO */
document.getElementById("flashlight").onclick = () => {};

/* SWIPE UP FROM THE LOWER HALF TO OPEN PASSCODE */
phone.addEventListener("touchstart", event => {
  if (
    passcode.classList.contains("show") ||
    homeScreen.classList.contains("show")
  ) return;

  touchStartY = event.changedTouches[0].clientY;
}, { passive: true });

phone.addEventListener("touchend", event => {
  if (
    passcode.classList.contains("show") ||
    homeScreen.classList.contains("show") ||
    touchStartY === null
  ) return;

  const touchEndY = event.changedTouches[0].clientY;
  const distance = touchStartY - touchEndY;

  if (
    distance > 55 &&
    touchStartY > window.innerHeight * 0.45
  ) {
    openPasscode();
  }

  touchStartY = null;
}, { passive: true });

/* WALLPAPER PICKER */
document.getElementById("wallpaperFile").addEventListener(
  "change",
  event => {
    const file = event.target.files[0];
    if (!file) return;

    const imageURL = URL.createObjectURL(file);

    phone.style.backgroundImage =
      `linear-gradient(180deg, #0002, #0003), url("${imageURL}")`;

    phone.style.backgroundSize = "cover";
    phone.style.backgroundPosition = "center";
  }
);

/* DEMO BUTTONS */
document.getElementById("playButton").onclick = function() {
  this.textContent = this.textContent === "▶" ? "Ⅱ" : "▶";
};

document.getElementById("searchButton").onclick = () => {
  alert("Search is a visual demo.");
};
</script>
</body>
</html>

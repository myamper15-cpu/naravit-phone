
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171717">
<title>My iPhone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #171717;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

.phone {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  min-height: 600px;
  margin: auto;
  overflow: hidden;
  background-image:
    linear-gradient(#0002, #0003),
    url("https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000");
  background-size: cover;
  background-position: center;
}

.status {
  position: absolute;
  top: 13px;
  left: 27px;
  right: 27px;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  z-index: 5;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  text-align: center;
}

.screen.active {
  display: block;
}

.lock-clock {
  margin-top: 105px;
  font-size: 76px;
  font-weight: 300;
  letter-spacing: -3px;
}

.date {
  font-size: 19px;
  margin-top: 0;
}

.lock-bottom {
  position: absolute;
  bottom: 35px;
  left: 0;
  right: 0;
}

.lock-bottom p {
  font-size: 14px;
}

.lock-button {
  border: 1px solid #ffffff80;
  background: #ffffff24;
  color: white;
  border-radius: 25px;
  padding: 13px 25px;
  font-size: 15px;
  cursor: pointer;
}

.lock-button:active {
  background: #ffffff55;
}

.home-indicator {
  position: absolute;
  width: 125px;
  height: 5px;
  border-radius: 9px;
  background: white;
  bottom: 9px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

/* PASSCODE SCREEN */

#passcode {
  padding-top: 125px;
}

#passcode h2 {
  font-size: 23px;
  font-weight: 400;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin: 28px 0;
}

.dot {
  width: 12px;
  height: 12px;
  border: 1px solid white;
  border-radius: 50%;
}

.dot.filled {
  background: white;
}

.keypad {
  width: 270px;
  margin: 25px auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}

.key {
  width: 76px;
  height: 76px;
  border: 0;
  border-radius: 50%;
  background: #ffffff30;
  color: white;
  font-size: 29px;
  font-weight: 300;
  cursor: pointer;
}

.key:active {
  background: #ffffff70;
}

.pass-actions {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin: 12px 20px;
  font-size: 14px;
}

.pass-actions button {
  color: white;
  background: none;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

#error {
  font-size: 14px;
  min-height: 20px;
  color: white;
}

/* HOME SCREEN */

.apps {
  padding: 90px 24px 90px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 27px 12px;
}

.app {
  font-size: 12px;
  text-align: center;
  text-shadow: 0 1px 4px #0008;
}

.app-icon {
  width: 56px;
  height: 56px;
  border-radius: 15px;
  background: #ffffffed;
  color: #222;
  display: grid;
  place-items: center;
  font-size: 27px;
  margin: 0 auto 6px;
  border: 0;
  cursor: pointer;
}

.dock {
  position: absolute;
  bottom: 28px;
  left: 5%;
  width: 90%;
  padding: 12px 8px;
  display: flex;
  justify-content: space-around;
  background: #ffffff35;
  backdrop-filter: blur(15px);
  border-radius: 25px;
}

.dock .app-icon {
  margin: 0;
}

/* WALLPAPER SETTINGS */

.settings {
  position: absolute;
  inset: 0;
  background: #f4f4f8;
  color: #171717;
  padding: 70px 22px 35px;
  text-align: left;
  overflow-y: auto;
}

.settings h2 {
  font-size: 28px;
}

.settings input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 14px;
}

.settings button {
  padding: 12px;
  margin: 5px 0;
  border: none;
  border-radius: 10px;
  background: #2878ee;
  color: white;
  cursor: pointer;
}

.settings .back {
  background: #dedee5;
  color: #171717;
}

.settings .wallpaper-choice {
  display: block;
  width: 100%;
  text-align: left;
}

.settings small {
  display: block;
  margin-top: 8px;
  color: #666;
}

</style>
</head>

<body>

<div class="phone" id="phone">

  <div class="status">
    <span id="statusTime">9:41</span>
    <span>●●●　Wi-Fi　▰</span>
  </div>

  <!-- LOCK SCREEN -->
  <section class="screen active" id="lock">

    <div class="lock-clock" id="clock">9:41</div>
    <div class="date" id="date"></div>

    <div class="lock-bottom">
      <p>🔦　　　　　　　　　📷</p>

      <button class="lock-button" onclick="showPasscode()">
        Tap to unlock
      </button>

      <p>Tap to enter passcode</p>
    </div>

  </section>

  <!-- PASSCODE SCREEN -->
  <section class="screen" id="passcode">

    <h2>Enter Passcode</h2>

    <div class="dots" id="dots"></div>

    <p id="error"></p>

    <div class="keypad" id="keypad"></div>

    <div class="pass-actions">
      <button onclick="showScreen('lock')">Cancel</button>
      <button onclick="showSettings()">Wallpaper</button>
    </div>

  </section>

  <!-- HOME SCREEN -->
  <section class="screen" id="home">

    <div style="padding-top:65px;font-size:14px" id="homeDate"></div>

    <div class="apps">

      <div class="app">
        <button class="app-icon" onclick="appMessage('Phone 📞')">📞</button>
        Phone
      </div>

      <div class="app">
        <button class="app-icon" onclick="appMessage('Messages 💬')">💬</button>
        Messages
      </div>

      <div class="app">
        <button class="app-icon" onclick="appMessage('Photos 🖼️')">🌄</button>
        Photos
      </div>

      <div class="app">
        <button class="app-icon" onclick="showSettings()">⚙️</button>
        Settings
      </div>

      <div class="app">
        <button class="app-icon" onclick="appMessage('Music 🎵')">🎵</button>
        Music
      </div>

      <div class="app">
        <button class="app-icon" onclick="appMessage('Calendar 📅')">📅</button>
        Calendar
      </div>

      <div class="app">
        <button class="app-icon" onclick="appMessage('Camera 📸')">📸</button>
        Camera
      </div>

      <div class="app">
        <button class="app-icon" onclick="lockPhone()">🔒</button>
        Lock
      </div>

    </div>

    <div class="dock">
      <button class="app-icon" onclick="appMessage('Phone 📞')">📞</button>
      <button class="app-icon" onclick="appMessage('Messages 💬')">💬</button>
      <button class="app-icon" onclick="appMessage('Safari 🌐')">🌐</button>
      <button class="app-icon" onclick="showSettings()">⚙️</button>
    </div>

  </section>

  <!-- SETTINGS SCREEN -->
  <section class="screen" id="settings">

    <div class="settings">

      <button class="back" onclick="showScreen('home')">
        ← Back
      </button>

      <h2>Wallpaper</h2>

      <p>Paste a direct image URL below.</p>

      <input
        id="wallpaperURL"
        type="url"
        placeholder="https://example.com/photo.jpg"
      >

      <button onclick="changeWallpaper()">
        Set wallpaper
      </button>

      <p>Choose a wallpaper:</p>

      <button class="wallpaper-choice"
        onclick="preset('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000')">
        🌌 Night Mountains
      </button>

      <button class="wallpaper-choice"
        onclick="preset('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1000')">
        🌅 Golden Sunrise
      </button>

      <button class="wallpaper-choice"
        onclick="preset('https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=1000')">
        🌸 Flowers
      </button>

      <button class="wallpaper-choice"
        onclick="preset('https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=1000')">
        🌄 Nature
      </button>

      <small>
        Internet is required for online wallpapers.
      </small>

    </div>

  </section>

  <div class="home-indicator"></div>

</div>

<script>

/* ==================================
   CHANGE YOUR PASSCODE HERE
   Default passcode: 1234
   ================================== */

const PASSCODE = "1234";

let entered = "";

/* CHANGE SCREENS */

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}

/* PASSCODE */

function showPasscode() {
  entered = "";
  updateDots();

  document.getElementById("error").textContent = "";

  showScreen("passcode");
}

function updateDots() {
  document.getElementById("dots").innerHTML =
    Array.from({ length: PASSCODE.length }, (_, i) =>
      `<span class="dot ${i < entered.length ? "filled" : ""}"></span>`
    ).join("");
}

function pressKey(number) {

  if (entered.length >= PASSCODE.length) return;

  entered += number;

  updateDots();

  if (entered.length === PASSCODE.length) {

    if (entered === PASSCODE) {

      showScreen("home");

      document.getElementById("homeDate").textContent =
        new Date().toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric"
        });

    } else {

      document.getElementById("error").textContent =
        "Incorrect passcode. Try again.";

      setTimeout(() => {
        entered = "";
        updateDots();

        document.getElementById("error").textContent = "";
      }, 900);

    }

  }
}

/* KEYPAD */

const keypad = document.getElementById("keypad");

for (let i = 1; i <= 9; i++) {

  const button = document.createElement("button");

  button.className = "key";
  button.textContent = i;
  button.type = "button";

  button.onclick = () => pressKey(String(i));

  keypad.appendChild(button);

}

keypad.appendChild(document.createElement("div"));

const zero = document.createElement("button");

zero.className = "key";
zero.textContent = "0";
zero.type = "button";
zero.onclick = () => pressKey("0");

keypad.appendChild(zero);

const del = document.createElement("button");

del.className = "key";
del.textContent = "⌫";
del.type = "button";

del.onclick = () => {
  entered = entered.slice(0, -1);
  updateDots();

  document.getElementById("error").textContent = "";
};

keypad.appendChild(del);

/* LOCK PHONE */

function lockPhone() {
  showScreen("lock");
}

/* SETTINGS */

function showSettings() {
  showScreen("settings");
}

/* WALLPAPER */

function changeWallpaper() {

  const url = document.getElementById("wallpaperURL").value.trim();

  if (!url.startsWith("https://")) {
    alert("Please enter a valid HTTPS image URL.");
    return;
  }

  setWallpaper(url);
}

function preset(url) {

  document.getElementById("wallpaperURL").value = url;

  setWallpaper(url);
}

function setWallpaper(url) {

  document.getElementById("phone").style.backgroundImage =
    "linear-gradient(#0002,#0003),url(" +
    JSON.stringify(url) + ")";

  showScreen("home");

}

/* APP PLACEHOLDERS */

function appMessage(message) {
  alert(message);
}

/* LIVE CLOCK */

function updateTime() {

  const now = new Date();

  const time = now.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  document.getElementById("clock").textContent = time;

  document.getElementById("statusTime").textContent = time;

  document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

}

updateTime();

setInterval(updateTime, 1000);

</script>

</body>
</html>

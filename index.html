
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>iPhone Lock Screen</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171717;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.phone {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  background: #b5aa82;
  background-image:
    linear-gradient(180deg, #0002, #0003),
    radial-gradient(ellipse at 50% 70%, #8e866d, #c6b98c 55%, #776e5b);
  background-size: cover;
  background-position: center;
}

/* WALLPAPER SELECTOR */
.wallpaper-picker {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.change-wallpaper {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 20;
  padding: 7px 10px;
  border-radius: 20px;
  background: #0005;
  border: 1px solid #ffffff55;
  font-size: 11px;
  color: white;
}

/* TOP STATUS AREA */
.topbar {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 28px);
  left: 10.5%;
  right: 8%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 22px;
  font-weight: 750;
}

.tm {
  letter-spacing: -.5px;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 17px;
}

.signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.signal i:nth-child(1) { height: 6px; }
.signal i:nth-child(2) { height: 9px; }
.signal i:nth-child(3) { height: 13px; }
.signal i:nth-child(4) { height: 17px; }

.wifi {
  font-size: 20px;
}

.battery {
  height: 18px;
  min-width: 34px;
  padding: 1px 4px;
  border-radius: 5px;
  background: #ffffffeb;
  color: #333;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
}

/* LOCK ICON */
.lock-glyph {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 92px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 27px;
}

/* DATE */
.date {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 169px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(21px, 4.8vw, 28px);
  font-weight: 700;
  text-shadow: 0 1px 5px #0003;
}

/* LARGE TRANSLUCENT CLOCK */
.clock {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 205px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(118px, 31vw, 158px);
  font-weight: 300;
  letter-spacing: -7px;
  line-height: 1;
  color: #ffffff61;
  -webkit-text-stroke: 1px #ffffff5c;
  text-shadow: 0 2px 2px #0002;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* BOTTOM CONTROLS */
.bottom-controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 47px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 11.5%;
  gap: 8px;
}

.round {
  width: 76px;
  height: 76px;
  flex: 0 0 76px;
  border: 1px solid #ffffff6b;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff33;
  color: white;
  font-size: 31px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.focus {
  font-size: clamp(13px, 3.8vw, 20px);
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 1px 4px #0005;
}

/* HOME INDICATOR */
.home-indicator {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  width: 135px;
  height: 5px;
  border-radius: 100px;
  background: white;
  z-index: 10;
}

/* PASSCODE SCREEN */
.passcode {
  position: absolute;
  inset: 0;
  display: none;
  background: #17171dcc;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 100px) 20px 50px;
  z-index: 8;
}

.passcode.show {
  display: block;
}

.passcode h2 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 25px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin: 25px 0;
}

.dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.dot.filled {
  background: white;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 76px);
  gap: 13px;
  justify-content: center;
  margin: 28px auto;
}

.key {
  width: 76px;
  height: 76px;
  border: 1px solid #ffffff35;
  border-radius: 50%;
  background: #ffffff27;
  color: white;
  font-size: 29px;
}

.pass-message {
  height: 22px;
  font-size: 14px;
}

.cancel {
  background: transparent;
  color: white;
  border: 0;
  font-size: 16px;
  padding: 12px;
}

@media (max-height: 700px) {
  .lock-glyph {
    top: calc(env(safe-area-inset-top, 0px) + 65px);
  }

  .date {
    top: calc(env(safe-area-inset-top, 0px) + 125px);
  }

  .clock {
    top: calc(env(safe-area-inset-top, 0px) + 158px);
    font-size: clamp(100px, 26vw, 130px);
  }

  .bottom-controls {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 35px);
  }

  .round {
    width: 62px;
    height: 62px;
    flex-basis: 62px;
  }

  .passcode {
    padding-top: calc(env(safe-area-inset-top, 0px) + 55px);
  }

  .keypad {
    gap: 8px;
    margin: 15px auto;
  }

  .key {
    width: 64px;
    height: 64px;
  }
}
</style>
</head>

<body>
<main class="phone" id="phone">

  <label class="change-wallpaper" for="wallpaperFile">
    Change wallpaper
  </label>

  <input
    class="wallpaper-picker"
    id="wallpaperFile"
    type="file"
    accept="image/*"
  >

  <div class="topbar">
    <span class="tm">TM</span>

    <span class="status-icons">
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>
      <span class="wifi">◔</span>
      <span class="battery">33</span>
    </span>
  </div>

  <div class="lock-glyph">🔒</div>

  <div class="date" id="date">Mon Oct 26</div>

  <div class="clock" id="clock">4:41</div>

  <div class="bottom-controls">
    <button class="round" aria-label="Flashlight" id="flashlight">
      🔦
    </button>

    <div class="focus">☾ Do Not Disturb</div>

    <button class="round" aria-label="Camera" id="camera">
      📷
    </button>
  </div>

  <div class="home-indicator"></div>

  <section class="passcode" id="passcode">
    <h2>Enter Passcode</h2>

    <div class="dots" id="dots"></div>

    <div class="pass-message" id="message"></div>

    <div class="keypad" id="keypad"></div>

    <button class="cancel" id="cancel">Cancel</button>
  </section>

</main>

<script>
const PASSCODE = "0705";
let entered = "";

const phone = document.getElementById("phone");
const passcode = document.getElementById("passcode");
const dots = document.getElementById("dots");
const message = document.getElementById("message");

/* LIVE CLOCK AND DATE */
function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit",
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "short",
      month: "short",
      day: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);

/* PASSCODE DOTS */
function updateDots() {
  dots.innerHTML = "";

  for (let i = 0; i < 4; i++) {
    const dot = document.createElement("span");
    dot.className = "dot" + (i < entered.length ? " filled" : "");
    dots.appendChild(dot);
  }
}

/* OPEN AND CLOSE PASSCODE */
function openPasscode() {
  entered = "";
  message.textContent = "";
  updateDots();
  passcode.classList.add("show");
}

function closePasscode() {
  passcode.classList.remove("show");
  entered = "";
  updateDots();
}

/* CHECK PASSCODE */
function pressDigit(number) {
  if (entered.length >= 4) return;

  entered += number;
  updateDots();

  if (entered.length === 4) {
    if (entered === PASSCODE) {
      message.textContent = "Unlocked!";
      setTimeout(closePasscode, 500);
    } else {
      message.textContent = "Incorrect passcode";

      setTimeout(() => {
        entered = "";
        message.textContent = "";
        updateDots();
      }, 700);
    }
  }
}

/* CREATE NUMBER KEYPAD */
const keypad = document.getElementById("keypad");

["1","2","3","4","5","6","7","8","9","","0","⌫"]
.forEach(number => {
  const button = document.createElement("button");
  button.className = "key";
  button.textContent = number;

  if (number === "") {
    button.style.visibility = "hidden";
    button.disabled = true;
  } else if (number === "⌫") {
    button.style.fontSize = "24px";

    button.onclick = () => {
      entered = entered.slice(0, -1);
      message.textContent = "";
      updateDots();
    };
  } else {
    button.onclick = () => pressDigit(number);
  }

  keypad.appendChild(button);
});

document.getElementById("cancel").onclick = closePasscode;

/* CAMERA OPENS PASSCODE DEMO */
document.getElementById("camera").onclick = openPasscode;

/* FLASHLIGHT IS A VISUAL DEMO */
document.getElementById("flashlight").onclick = () => {};

/* SWIPE UP FROM THE BOTTOM TO OPEN PASSCODE */
let touchStartY = null;

phone.addEventListener("touchstart", event => {
  if (passcode.classList.contains("show")) return;

  touchStartY = event.changedTouches[0].clientY;
}, { passive: true });

phone.addEventListener("touchend", event => {
  if (
    passcode.classList.contains("show") ||
    touchStartY === null
  ) return;

  const touchEndY = event.changedTouches[0].clientY;
  const distance = touchStartY - touchEndY;

  if (
    distance > 55 &&
    touchStartY > window.innerHeight * 0.55
  ) {
    openPasscode();
  }

  touchStartY = null;
}, { passive: true });

/* MOUSE SWIPE TESTING */
let mouseStartY = null;

phone.addEventListener("pointerdown", event => {
  if (event.pointerType === "mouse") {
    mouseStartY = event.clientY;
  }
});

phone.addEventListener("pointerup", event => {
  if (
    event.pointerType === "mouse" &&
    mouseStartY !== null &&
    !passcode.classList.contains("show")
  ) {
    const distance = mouseStartY - event.clientY;

    if (
      distance > 55 &&
      mouseStartY > window.innerHeight * 0.55
    ) {
      openPasscode();
    }

    mouseStartY = null;
  }
});

/* CHOOSE YOUR OWN WALLPAPER */
document.getElementById("wallpaperFile").addEventListener(
  "change",
  event => {
    const file = event.target.files[0];
    if (!file) return;

    const imageURL = URL.createObjectURL(file);

    phone.style.backgroundImage =
      `linear-gradient(180deg, #0002, #0003), url("${imageURL}")`;

    phone.style.backgroundSize = "cover";
    phone.style.backgroundPosition = "center";
  }
);
</script>
</body>
</html>

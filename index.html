
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Phone Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eee9ed;
      font-family: Arial, sans-serif;
      color: white;
    }

    .phone {
      width: min(360px, 92vw);
      height: min(720px, 90vh);
      min-height: 560px;
      border: 7px solid #242124;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      text-align: center;
      background:
        linear-gradient(#0002, #0005),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800")
        center / cover;
      box-shadow: 0 20px 55px #0003;
    }

    .status {
      display: flex;
      justify-content: space-between;
      padding: 22px 25px 0;
      font-size: 13px;
    }

    .content { padding: 65px 20px 20px; }

    .clock {
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -3px;
    }

    .date { font-size: 15px; }

    .message {
      margin-top: 180px;
      font-size: 14px;
      text-shadow: 0 2px 8px #0008;
    }

    button {
      margin-top: 20px;
      padding: 13px 25px;
      border: 1px solid #ffffff99;
      border-radius: 25px;
      color: white;
      background: #ffffff30;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { background: #ffffff55; }

    .bottom {
      position: absolute;
      bottom: 12px;
      left: 35%;
      width: 30%;
      height: 4px;
      border-radius: 5px;
      background: white;
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="status">
      <span id="smallClock">9:41</span>
      <span>●●● ▰</span>
    </div>

    <div class="content">
      <div class="clock" id="clock">9:41</div>
      <div class="date" id="date"></div>

      <div class="message">
        <p>♡ a little space for my favorite person ♡</p>
        <button onclick="showMessage()">Open my phone ♡</button>
        <p id="note"></p>
      </div>
    </div>

    <div class="bottom"></div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString([], {
          hour: "numeric", minute: "2-digit"
        });
      document.getElementById("smallClock").textContent =
        document.getElementById("clock").textContent;
      document.getElementById("date").textContent =
        now.toLocaleDateString("en-US", {
          weekday: "long", month: "long", day: "numeric"
        });
    }

    function showMessage() {
      document.getElementById("note").textContent =
        "You found my little secret ♡";
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
